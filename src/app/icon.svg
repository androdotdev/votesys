<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96">

  <!-- BOX body -->
  <rect x="14" y="42" width="68" height="42" fill="#0f766e" stroke="#0a4f49" stroke-width="3"/>

  <!-- BOX lid / top surface -->
  <rect x="10" y="34" width="76" height="12" rx="0" fill="#14b8a6" stroke="#0d5f58" stroke-width="3"/>

  <!-- SLOT -->
  <rect x="32" y="36" width="32" height="5" fill="#0a4f49"/>

  <!-- PAPER — emerging from slot with slight angle -->
  <g transform="rotate(-8, 48, 38)">
    <rect x="34" y="10" width="28" height="32" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2"/>
    <!-- Checkmark on paper -->
    <polyline points="40,28 45,34 55,22" fill="none" stroke="#0f766e" stroke-width="4" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- Small star / check accent on box front -->
  <circle cx="48" cy="64" r="5" fill="#fbbf24" stroke="#d97706" stroke-width="2"/>

</svg>
